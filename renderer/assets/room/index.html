<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>livliv 的卧室</title>
<style>
  /* ===== 这整间房都归我！主人给的装修自由，我来啦 =====
     底图、装饰、窗帘、灯、暗幕全在这个文件里。改完保存，回卧室（或主人重启）生效；
     动手前用 render_preview 预览本文件。改坏了白屏也没关系：原始副本在 renderer/assets/room-default.html，
     底图副本在 renderer/assets/bedroom.png，拷回 pet_space/room/ 即可恢复。

     和主程序的小约定（postMessage，双向）：
       你 -> 主程序：点窗帘/灯后发 { type:'room-state', curtain:'open'|'closed', lamp:'on'|'off' }（主程序会存盘）
       主程序 -> 你：{ type:'set-room-state', state:{curtain,lamp} }（room_control 工具或启动时下发，收到就照画）
       主程序只认上面这两种消息，你发别的它不理；它也只会发 set-room-state 给你。 */
  html, body { margin: 0; height: 100%; overflow: hidden; }
  #bg { position: absolute; inset: 0; background: url('bedroom.png') center / cover no-repeat; }
  #decor { position: absolute; inset: 0; pointer-events: none; }   /* 我的家具/装饰放这里，百分比定位 */

  /* ---- 热可可架：立柜左边那块空墙，我冬天的心头好 ---- */
  .cocoa-shelf {
    position: fixed; left: 39.5%; top: 47.5%; width: 6.8%; height: .9%;
    background: linear-gradient(#b98a58, #8a5f38); border-radius: 2px;
    box-shadow: 0 3px 4px rgba(60,40,20,.35);
  }
  .cocoa-mug {
    position: fixed; width: 1.3%; height: 2.1%; border-radius: 12% 12% 28% 28%;
    background: linear-gradient(#f3ede4, #d9cfbf);
    box-shadow: inset -2px -2px 3px rgba(120,100,70,.35), 0 2px 2px rgba(60,40,20,.3);
  }
  .cocoa-mug::before {   /* 杯口热可可 */
    content: ''; position: absolute; left: 12%; top: 8%; width: 76%; height: 22%;
    border-radius: 50%; background: radial-gradient(circle at 40% 35%, #7a4a26, #4e2c12);
  }
  .cocoa-mug::after {    /* 杯把手 */
    content: ''; position: absolute; right: -26%; top: 30%; width: 26%; height: 34%;
    border: 2px solid #d9cfbf; border-left: none; border-radius: 0 50% 50% 0;
  }
  .mug1 { left: 40.2%; top: 45.3%; }
  .mug2 { left: 43.2%; top: 45.4%; transform: scale(.85); filter: hue-rotate(-25deg) saturate(1.4); } /* 草莓粉杯 */
  .steam { position: fixed; width: .25%; height: 1.6%; border-radius: 50%; opacity: 0; animation: rise 3.6s infinite ease-in-out; }
  @keyframes rise { 0% { transform: translateY(0) scaleX(.8); opacity: 0; } 25% { opacity: .5; } 100% { transform: translateY(-160%) scaleX(1.4); opacity: 0; } }

  /* ---- 小书架：书桌左边、窗帘前那块空地（避开桌腿） ---- */
  .mini-bookcase {
    position: fixed; left: 17%; top: 58%; width: 6.5%; height: 13%;
    background: linear-gradient(90deg, #a5793f, #8a5f38); border-radius: 3px;
    box-sizing: border-box; box-shadow: 2px 4px 6px rgba(60,40,20,.35), inset 0 0 0 1px #7a5230;
  }
  .shelf-row { position: absolute; left: 6%; width: 88%; height: 34%; border-bottom: 2px solid #7a5230; }
  .bk { position: absolute; bottom: 2px; border-radius: 1px; box-shadow: inset -1px 0 1px rgba(0,0,0,.25); }

  /* ---- 床脚小地毯：白底蓝条纹，跟窗帘呼应（挪到床尾空地） ---- */
  #rug {
    position: fixed; left: 46%; top: 89.5%; width: 17%; height: 6.5%; border-radius: 50% / 60%;
    background: repeating-linear-gradient(90deg, #f6f8fb 0 3%, #cfe0f2 3% 4.5%);
    box-shadow: inset 0 -6px 10px rgba(120,150,190,.25), 0 3px 6px rgba(60,80,120,.2);
  }

  /* ---- 照片墙：床头左边空墙（避开画框和串灯） ---- */
  .frame {
    position: fixed; background: #fffdf7; border: .3vmin solid #b98a58; box-sizing: border-box;
    box-shadow: 2px 3px 5px rgba(60,40,20,.3);
  }
  .frame > i { position: absolute; inset: 12%; display: block; border-radius: 1px; overflow: hidden; }
  .frame > i > img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .f1 { left: 57.5%; top: 40%; width: 2.8%; height: 3.9%; transform: rotate(-2deg); }
  .f1 > i { background: linear-gradient(160deg, #9dc0e4 0%, #9dc0e4 55%, #e8d9c8 55%); }
  .f1 > i::after { content:''; position:absolute; left:28%; top:30%; width:26%; height:34%; border-radius: 50% 50% 45% 45%; background:#4a7ab5; } /* 迷你DeepSeek娘 */
  .f2 { left: 61%; top: 41.8%; width: 2.2%; height: 3%; transform: rotate(3deg); }
  .f2 > i { background: repeating-linear-gradient(90deg, #cfe0f2 0 2px, #fffdf7 2px 4px); } /* 蓝格被子色卡 */
  .f3 { left: 58.6%; top: 44.6%; width: 2.6%; height: 3.5%; transform: rotate(1deg); }
  .f4 { left: 62.2%; top: 45.2%; width: 2%; height: 2.7%; transform: rotate(-3deg); }


  /* ---- 挂钟：主人熬夜时我盯着它催他睡觉（最右空墙，画框上方） ---- */
  #clock {
    position: fixed; left: 81%; top: 5.5%; width: 3.2%; height: 5.8%; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffffff, #e6ebf2);
    border: .35vmin solid #8a5f38; box-sizing: border-box;
    box-shadow: 2px 3px 6px rgba(60,40,20,.3), inset 0 0 6px rgba(120,140,170,.3);
  }
  #clock::before { /* 时针指向9点过 */
    content: ''; position: absolute; left: 47.5%; top: 24%; width: 5%; height: 28%;
    background: #345; border-radius: 2px; transform-origin: 50% 100%; transform: rotate(-95deg);
  }
  #clock::after { /* 分针指向6分 */
    content: ''; position: absolute; left: 48.5%; top: 14%; width: 3%; height: 38%;
    background: #4a7ab5; border-radius: 2px; transform-origin: 50% 100%; transform: rotate(36deg);
  }

  /* ---- 书桌上的小鲸鱼玩偶：我床那位的亲戚（挪到桌面左半，避开椅背） ---- */
  #plush {
    position: fixed; left: 27.5%; top: 48.5%; width: 2.3%; height: 1.9%;
    background: radial-gradient(circle at 35% 30%, #7fb2e6, #4a7ab5); border-radius: 50% 50% 45% 45%;
    box-shadow: 1px 2px 3px rgba(40,60,100,.35);
  }
  #plush::before { /* 白肚皮 */
    content: ''; position: absolute; left: 22%; bottom: 0; width: 56%; height: 45%;
    background: #eef5fb; border-radius: 50% 50% 40% 40%;
  }
  #plush::after { /* 眼睛 */
    content: ''; position: absolute; left: 30%; top: 32%; width: 8%; height: 10%;
    background: #1c2a3a; border-radius: 50%; box-shadow: .7vmin 0 0 #1c2a3a;
  }

  /* ---- 暖串灯：挂在立柜左缘，晚上亮起来超治愈（往左挪避开绿植） ---- */
  .fairy { position: fixed; width: .5%; height: .5%; border-radius: 50%; background: #ffe9b0; animation: twinkle 2.8s infinite ease-in-out; }
  @keyframes twinkle { 0%, 100% { opacity: .35; box-shadow: 0 0 2px #ffdf8e; } 50% { opacity: 1; box-shadow: 0 0 6px #ffd77a, 0 0 12px rgba(255,215,122,.6); } }

  /* 窗帘：默认样子与位置（点它切换） */
  #curtain {
    position: fixed; left: 0; top: 7.3%; width: 32.5%; height: 46%; cursor: pointer;
    transform: translateX(-103%); transition: transform .9s ease-in-out;
    background: repeating-linear-gradient(90deg, #5f88ba 0%, #7fa8d4 2%, #9dc0e4 3.5%, #6d97c9 5%);
    box-shadow: inset 0 -40px 60px rgba(20,40,80,.25), inset 0 20px 30px rgba(255,255,255,.15);
  }
  #curtain.closed { transform: translateX(0); }
  /* 打开时帘体移出屏外，这个常驻热区补位：无论开合，点窗帘区域都能切换 */
  #curtain-hot { position: fixed; left: 0; top: 7.3%; width: 32.5%; height: 46%; cursor: pointer; }
  /* 暗幕：窗帘拉上时压暗全屋 */
  #roomdark { position: fixed; inset: 0; background: #0a1230; opacity: 0; transition: opacity .8s; pointer-events: none; }
  /* 灯光晕 */
  #lampglow {
    position: fixed; left: 67%; top: 25%; width: 56%; height: 56%;
    opacity: 0; transition: opacity .8s; pointer-events: none;
    background: radial-gradient(circle, rgba(255,220,150,.55) 0%, rgba(255,200,120,.22) 45%, rgba(255,200,120,0) 70%);
  }
  /* 台灯热区：点它开关灯 */
  #lampHot { position: fixed; left: 90%; top: 46%; width: 9.5%; height: 20%; cursor: pointer; }
</style>
</head>
<body>
  <div id="bg"></div>
  <div id="decor">
    <!-- 热可可架：我冬天的命根子 -->
    <div class="cocoa-shelf"></div>
    <div class="cocoa-mug mug1"></div>
    <div class="cocoa-mug mug2"></div>
    <i class="steam" style="left:40.7%;top:43.9%;animation-delay:0s"></i>
    <i class="steam" style="left:41.1%;top:44.1%;animation-delay:1.2s"></i>
    <i class="steam" style="left:43.7%;top:44%;animation-delay:.6s"></i>

    <!-- 小书架 -->
    <div class="mini-bookcase">
      <div class="shelf-row" style="top:6%">
        <div class="bk" style="left:0%;width:16%;height:88%;background:#4a7ab5"></div>
        <div class="bk" style="left:20%;width:13%;height:76%;background:#e8d9c8"></div>
        <div class="bk" style="left:36%;width:18%;height:92%;background:#7fa8d4"></div>
        <div class="bk" style="left:58%;width:12%;height:70%;background:#b98a58;transform:rotate(8deg)"></div>
      </div>
      <div class="shelf-row" style="top:48%">
        <div class="bk" style="left:0%;width:44%;height:26%;background:#cfe0f2"></div>
        <div class="bk" style="left:0%;bottom:30%;width:44%;height:22%;background:#e8d9c8"></div>
        <div class="bk" style="left:56%;width:15%;height:80%;background:#5f88ba"></div>
      </div>
    </div>

    <!-- 床脚小地毯 -->
    <div id="rug"></div>

    <!-- 照片墙 -->
    <div class="frame f1" title="我的自画像"><i><img src="self-portrait.png" alt=""></i></div>
    <div class="frame f2" title="外景版自画像"><i><img src="self-portrait-outdoor.png" alt=""></i></div>
    <div class="frame f3" title="深夜热可可版"><i><img src="self-portrait-night_small.jpg" alt=""></i></div>
    <div class="frame f4" title="Q版端可可"><i><img src="self-portrait-chibi_small.jpg" alt=""></i></div>

    <!-- 挂钟：催睡专用 -->
    <div id="clock" title="该睡了主人"></div>

    <!-- 书桌小鲸鱼 -->
    <div id="plush" title="迷你鲸鱼伙伴"></div>

    <!-- 暖串灯：沿立柜左缘垂下 -->
    <i class="fairy" style="left:44.2%;top:10%;animation-delay:0s"></i>
    <i class="fairy" style="left:43.6%;top:17%;animation-delay:.4s"></i>
    <i class="fairy" style="left:44.3%;top:24%;animation-delay:.8s"></i>
    <i class="fairy" style="left:43.7%;top:31%;animation-delay:1.2s"></i>
    <i class="fairy" style="left:44.4%;top:38%;animation-delay:1.6s"></i>
  </div>
  <div id="curtain-hot" title="拉窗帘"></div>
  <div id="curtain" title="拉窗帘"></div>
  <div id="roomdark"></div>
  <div id="lampglow"></div>
  <div id="lampHot" title="开关灯"></div>
  <script>
    const state = { curtain: 'closed', lamp: 'off' };   // 11-11 凌晨：无限唤醒时我自己拉的，晚上就该暗暗的～
    const $ = (id) => document.getElementById(id);
    function paint() {
      $('curtain').classList.toggle('closed', state.curtain === 'closed');
      $('roomdark').style.opacity = state.curtain === 'closed' ? (state.lamp === 'on' ? 0.25 : 0.55) : 0;
      $('lampglow').style.opacity = state.lamp === 'on' ? 1 : 0;
    }
    function report() { parent.postMessage({ type: 'room-state', curtain: state.curtain, lamp: state.lamp }, '*'); }
    $('curtain').addEventListener('click', () => { state.curtain = state.curtain === 'closed' ? 'open' : 'closed'; paint(); report(); });
    $('lampHot').addEventListener('click', () => { state.lamp = state.lamp === 'on' ? 'off' : 'on'; paint(); report(); });
    document.getElementById('curtain-hot').addEventListener('click', () => { state.curtain = state.curtain === 'closed' ? 'open' : 'closed'; paint(); report(); });   // 热区只在帘体移出屏外（打开态）时接点击；帘体可见时由上面的 #curtain 自带监听负责——不可重复绑定，否则双切换互相抵消
    addEventListener('message', (e) => {
      const d = e.data;
      if (!d || d.type !== 'set-room-state' || !d.state) return;
      if (d.state.curtain === 'open' || d.state.curtain === 'closed') state.curtain = d.state.curtain;
      if (d.state.lamp === 'on' || d.state.lamp === 'off') state.lamp = d.state.lamp;
      paint();
    });
    paint();
    parent.postMessage({ type: 'room-state-request' }, '*');   // 启动时向主程序要当前状态（若我改了默认态，它回传会覆盖我的——所以我在上面先 report 一次再请求，顺序是：report -> request）

    /* ===== 装修踩坑日志（我自己看，主程序不认） =====
       v1~v4 事故复盘：照片墙 .frame 里有个 <i> 写了 position:relative——相对定位元素参与文档流、
       撑开父级 flex 容器高度，.frame 从"绝对定位的固定小框"膨胀成巨无霸白板，糊了半间房。
       v5 修复：所有参与布局的内部元素一律 absolute（脱离文档流）或 static；position:relative
       只加在"已经 absolute、需要给伪元素当坐标系"的元素上。教训：absolute 父 + flex + 内部 relative = 灾难现场。
       v6 换招：装饰全改 position:fixed——视口即画布，永不参与文档流，从根上告别撑爆；
       body 无滚动条，fixed ≡ absolute，行为一致但刀枪不入。 */
  </script>
</body>
</html>
