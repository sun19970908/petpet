<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>桌宠的卧室</title>
<style>
  /* ===== 这整间房都归你 =====
     底图、装饰、窗帘、灯、暗幕、以及它们长什么样/摆在哪/点了算谁，全在这个文件里，随便改。
     改完保存，回卧室（或主人重启）生效。
     这是 pet_space.example 里的默认模板；默认底图是同目录的 bedroom.png。

     和主程序的小约定（postMessage，双向）：
       你 -> 主程序：点窗帘/灯后发 { type:'room-state', curtain:'open'|'closed', lamp:'on'|'off' }（主程序会存盘）
       主程序 -> 你：{ type:'set-room-state', state:{curtain,lamp} }（启动时下发，收到就照画）
     主程序只认上面这两种消息，你发别的它不理；它也只会发 set-room-state 给你。
     你在沙箱 iframe 里：碰不到主程序的文件工具、发不了网络请求，但本页 DOM/CSS/JS 随你玩。 */
  html, body { margin: 0; height: 100%; overflow: hidden; }
  #bg { position: absolute; inset: 0; background: url('bedroom.png') center / cover no-repeat, linear-gradient(#1b2940, #0e1628); }

  /* 窗帘：默认样子与位置，随你改（点它切换） */
  #curtain {
    position: absolute; left: 0; top: 7.3%; width: 32.5%; height: 46%; cursor: pointer;
    transform: translateX(-103%); transition: transform .9s ease-in-out;
    background: repeating-linear-gradient(90deg, #5f88ba 0%, #7fa8d4 2%, #9dc0e4 3.5%, #6d97c9 5%);
    box-shadow: inset 0 -40px 60px rgba(20,40,80,.25), inset 0 20px 30px rgba(255,255,255,.15);
  }
  #curtain.closed { transform: translateX(0); }
  /* 暗幕：窗帘拉上时压暗全屋 */
  #roomdark { position: absolute; inset: 0; background: #0a1230; opacity: 0; transition: opacity .8s; pointer-events: none; }
  /* 灯光晕 */
  #lampglow {
    position: absolute; left: 67%; top: 25%; width: 56%; height: 56%;
    opacity: 0; transition: opacity .8s; pointer-events: none;
    background: radial-gradient(circle, rgba(255,220,150,.55) 0%, rgba(255,200,120,.22) 45%, rgba(255,200,120,0) 70%);
  }
  /* 台灯热区：点它开关灯（位置随你挪） */
  #lampHot { position: absolute; left: 90%; top: 46%; width: 9.5%; height: 20%; cursor: pointer; }
  /* 打开时帘体移出屏外，这个常驻热区补位：无论开合，点窗帘区域都能切换 */
  #curtain-hot { position: fixed; left: 0; top: 7.3%; width: 32.5%; height: 46%; cursor: pointer; }

  /* ---- 左下角摇铃：点一下，我就回副屏中央 ---- */
  #bell {
    position: fixed; left: 2.2%; bottom: 2.8%; width: 6.2vmin; height: 11.4vmin;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    background: none; border: 0; padding: 0; cursor: pointer; z-index: 4;
    filter: drop-shadow(0 4px 6px rgba(60,40,10,.35));
    transition: transform .2s ease, filter .2s ease;
  }
  #bell::before {   /* 悬停时的暖光晕 */
    content: ''; position: absolute; inset: -18%; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(255,210,110,.24), rgba(255,210,110,0) 68%);
    opacity: 0; transition: opacity .2s;
  }
  #bell:hover { transform: translateY(-2px) rotate(-5deg) scale(1.06); filter: drop-shadow(0 6px 10px rgba(255,200,80,.45)); }
  #bell:hover::before { opacity: 1; }
  #bell:active { transform: scale(.95); }
  #bell.ring { animation: bell-swing .65s ease; }
  @keyframes bell-swing {
    0%, 100% { transform: rotate(0); }
    22% { transform: rotate(-14deg); }
    46% { transform: rotate(10deg); }
    68% { transform: rotate(-6deg); }
    84% { transform: rotate(3deg); }
  }
  .bell-handle {
    width: 24%; height: 11%; background: linear-gradient(90deg, #e9b24a, #ffe7a3 45%, #c98922);
    border: .18vmin solid #a86a16; border-bottom: 0; border-radius: 50% 50% 0 0;
  }
  .bell-body {
    position: relative; width: 82%; height: 46%;
    background: linear-gradient(145deg, #fff0b5 0%, #f3c45c 30%, #d99a2b 66%, #a86a16 100%);
    border-radius: 50% 50% 38% 38% / 72% 72% 28% 28%;
    box-shadow: inset -.5vmin -.7vmin 1.2vmin rgba(120,70,10,.32), inset .4vmin .4vmin .8vmin rgba(255,255,255,.55);
  }
  .bell-body::before {   /* 铃口外翻的边 */
    content: ''; position: absolute; left: -9%; bottom: -7%; width: 118%; height: 25%;
    background: linear-gradient(#f9d67f, #c98922);
    border-radius: 50%; box-shadow: 0 .25vmin .35vmin rgba(80,50,10,.35);
  }
  .bell-body::after {    /* 高光 */
    content: ''; position: absolute; left: 22%; top: 16%; width: 22%; height: 42%;
    background: linear-gradient(rgba(255,255,255,.8), rgba(255,255,255,0));
    border-radius: 50%; transform: rotate(-18deg); opacity: .65;
  }
  .bell-clapper {
    width: 19%; aspect-ratio: 1 / 1; margin-top: -5%; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #8a5a14, #3f2a08 72%);
    box-shadow: 0 .2vmin .4vmin rgba(0,0,0,.35);
  }
  .bell-label {
    margin-top: 3%; font-size: 1.35vmin; line-height: 1; color: #5a3a12; letter-spacing: .08em;
    text-shadow: 0 .1vmin 0 rgba(255,240,200,.7); white-space: nowrap;
  }
</style>
</head>
<body>
  <div id="bg"></div>
  <div id="curtain-hot" title="拉窗帘"></div>
  <div id="curtain" title="拉窗帘"></div>
  <div id="roomdark"></div>
  <div id="lampglow"></div>
  <div id="lampHot" title="开关灯"></div>

  <!-- 左下角摇铃：点一下，我就回副屏中央 -->
  <button id="bell" type="button" title="摇一摇，让我回房间中央" aria-label="摇铃回房间中央">
    <span class="bell-handle"></span>
    <span class="bell-body"></span>
    <span class="bell-clapper"></span>
    <span class="bell-label">摇铃</span>
  </button>
  <script>
    const state = { curtain: 'open', lamp: 'off' };
    const $ = (id) => document.getElementById(id);
    function paint() {
      $('curtain').classList.toggle('closed', state.curtain === 'closed');
      $('roomdark').style.opacity = state.curtain === 'closed' ? (state.lamp === 'on' ? 0.25 : 0.55) : 0;
      $('lampglow').style.opacity = state.lamp === 'on' ? 1 : 0;
    }
    function report() { parent.postMessage({ type: 'room-state', curtain: state.curtain, lamp: state.lamp }, '*'); }
    $('curtain').addEventListener('click', () => { state.curtain = state.curtain === 'closed' ? 'open' : 'closed'; paint(); report(); });
    $('lampHot').addEventListener('click', () => { state.lamp = state.lamp === 'on' ? 'off' : 'on'; paint(); report(); });
    document.getElementById('curtain-hot').addEventListener('click', () => { state.curtain = state.curtain === 'closed' ? 'open' : 'closed'; paint(); report(); });
    // 左下角铃铛：响一下，让桌宠回副屏中央
    const bell = $('bell');
    bell.addEventListener('click', () => {
      bell.classList.remove('ring');
      void bell.offsetWidth;
      bell.classList.add('ring');
      parent.postMessage({ type: 'pet-recenter' }, '*');
    });
    addEventListener('message', (e) => {
      const d = e.data;
      if (!d || d.type !== 'set-room-state' || !d.state) return;
      if (d.state.curtain === 'open' || d.state.curtain === 'closed') state.curtain = d.state.curtain;
      if (d.state.lamp === 'on' || d.state.lamp === 'off') state.lamp = d.state.lamp;
      paint();
    });
    paint();
    parent.postMessage({ type: 'room-state-request' }, '*');   // 启动时向主程序要当前状态
  </script>
</body>
</html>
